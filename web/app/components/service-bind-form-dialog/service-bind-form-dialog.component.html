<h1 mat-dialog-title>
    Bindings
</h1>

<div mat-dialog-content>
    <form [formGroup]="form" id="service-bind-form">
        <div class="mat-row">
            <div class="mat-col-6">
                <mat-form-field class="full-width">
                    <mat-label>Protocol</mat-label>
                    <mat-select formControlName="protocol" id="service-bind-protocol-select">
                        @for (ut of _supportedProtocols; track ut) {
                        <mat-option [value]="ut" id="service-bind-protocol-option-{{ut}}">
                            {{ ut }}
                        </mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="mat-col-6">
                <mat-form-field class="full-width">
                    <mat-label>Port</mat-label>
                    <input matInput type="number" formControlName="port" id="service-bind-port-input">
                    @if (f['port'].errors) {
                        @if (f['port'].errors['required']) {
                        <mat-error class="error-message">
                            Required
                        </mat-error>
                        }
                    }
                </mat-form-field>
            </div>
        </div>
        <div class="mat-row">
            <div class="mat-col-12">
                @if (form.value.protocol == 'HTTP') {
                <mat-checkbox formControlName="ssl_upgrade" id="service-bind-ssl-upgrade">Force service to
                    ssl</mat-checkbox>

                @if (form.value.ssl_upgrade) {
                <mat-form-field class="full-width margin-top">
                    <mat-label>SSL Upgrade Port</mat-label>
                    <input matInput type="number" formControlName="ssl_upgrade_port" id="service-bind-ssl-upgrade-port-input">
                </mat-form-field>
                }
                }
            </div>
        </div>
    </form>
</div>
<div mat-dialog-actions align="end" class="dialog-actions">
    <button type="button" mat-stroked-button (click)="onCancel()" id="cancel-service-bind-btn">
        <mat-icon>keyboard_return</mat-icon>
        {{ 'actions.cancel' | translate }}
    </button>
    <button type="button" (click)="onSubmit()" mat-flat-button color="primary" id="save-service-bind-btn">
        <mat-icon>save</mat-icon>
        {{ 'actions.save' | translate }}
    </button>
</div>
