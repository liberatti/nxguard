name: CI / develop

on:
  push:
    branches: [ "v*-rc", "v*-fix"]
  pull_request:
    branches: [ "v*-rc", "v*-fix"]

permissions:
  contents: write

jobs:
  code-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest semgrep
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: |
          flake8 . --exclude=web --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exclude=web --count --exit-zero --max-complexity=50 --max-line-length=256 --statistics

  build-app-image:
    runs-on: ${{ matrix.runner }}
    needs: code-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: main
          platforms: ${{ matrix.platform }}
          outputs: ${{ github.event_name == 'push' && 'type=image,name=liberatti/nxguard,push-by-digest=true,name-canonical=true,push=true' || 'type=image,name=liberatti/nxguard,push=false' }}
          cache-from: type=gha,scope=v-branches-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=v-branches-{0}', matrix.arch) || '' }}

      - name: Export RPMs from Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: rpms
          outputs: type=local,dest=./dist/rpms
          cache-from: type=gha,scope=v-branches-${{ matrix.arch }}

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nxguard-rpms-el10-${{ matrix.arch }}
          path: ./dist/rpms/**/*.rpm
          retention-days: 14

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-images:
    if: github.event_name == 'push'
    needs: build-app-image
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-platform manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          DIGESTS=""
          for digest in *; do
            DIGESTS="$DIGESTS liberatti/nxguard@sha256:$digest"
          done
          docker buildx imagetools create -t liberatti/nxguard:latest $DIGESTS

      - name: Inspect final multi-arch image
        run: |
          docker buildx imagetools inspect liberatti/nxguard:latest
