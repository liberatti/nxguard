name: CI / main

on:
  pull_request:
    branches:
      - "main"
    types:
      - closed

permissions:
  contents: write
  issues: write

jobs:
  checkout:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      branch: ${{ steps.get_version.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: get_version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          BRANCH_NAME="$HEAD_REF"
          if [[ "$BRANCH_NAME" =~ ^v(.*)-(rc|fix)$ ]]; then
            if [[ "$BRANCH_NAME" =~ -fix$ ]]; then
              VERSION="${BRANCH_NAME%-fix}-hotfix-$(date +%Y%m%d%H%M%S)"
            else
              VERSION="${BRANCH_NAME%-rc}"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "Branch $BRANCH_NAME does not match v*-rc or v*-fix pattern"
            exit 1
          fi

  build-app-image:
    runs-on: ${{ matrix.runner }}
    needs: checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=liberatti/nxguard,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=main-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.arch }}

      - name: Export RPMs from Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: rpms
          outputs: type=local,dest=./dist/rpms
          cache-from: type=gha,scope=main-${{ matrix.arch }}

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nxguard-rpms-${{ needs.checkout.outputs.version }}-${{ matrix.arch }}
          path: ./dist/rpms/**/*.rpm
          retention-days: 30

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish-tag:
    needs: [checkout, build-app-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download all RPM Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nxguard-rpms-*
          path: ./dist/rpms
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-platform manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          DIGESTS=""
          for digest in *; do
            DIGESTS="$DIGESTS liberatti/nxguard@sha256:$digest"
          done
          docker buildx imagetools create \
            -t liberatti/nxguard:${{ needs.checkout.outputs.version }} \
            -t liberatti/nxguard:latest \
            $DIGESTS

      - name: Inspect final multi-arch image
        run: |
          docker buildx imagetools inspect liberatti/nxguard:${{ needs.checkout.outputs.version }}

      - name: Create and push tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.checkout.outputs.version }}
          git push origin ${{ needs.checkout.outputs.version }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          RPM_FILES=(./dist/rpms/**/*.rpm)
          gh release create ${{ needs.checkout.outputs.version }} "${RPM_FILES[@]}" --title "${{ needs.checkout.outputs.version }}" --generate-notes

      - name: Delete source branch
        run: |
          git push origin --delete ${{ needs.checkout.outputs.branch }}

      - name: Close Milestone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.checkout.outputs.version }}"
          MILESTONE_NUMBER=$(gh api repos/${{ github.repository }}/milestones --jq ".[] | select(.title | startswith(\"$VERSION\")) | .number")
          if [ -n "$MILESTONE_NUMBER" ]; then
            gh api -X PATCH repos/${{ github.repository }}/milestones/$MILESTONE_NUMBER -f state=closed
          fi
