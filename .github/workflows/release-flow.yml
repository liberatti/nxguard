name: CI / main

on:
  pull_request:
    branches:
      - "main"
    types:
      - closed

permissions:
  contents: write
  issues: write

jobs:
  checkout:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      branch: ${{ steps.get_version.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: get_version
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH_NAME" =~ ^v(.*)-(rc|fix)$ ]]; then
            if [[ "$BRANCH_NAME" =~ -fix$ ]]; then
              VERSION="${BRANCH_NAME%-fix}-hotfix-$(date +%Y%m%d%H%M%S)"
            else
              VERSION="${BRANCH_NAME%-rc}"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "Branch $BRANCH_NAME does not match v*-rc or v*-fix pattern"
            exit 1
          fi

  build-app-image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: liberatti/nxguard
          tags: |
            type=raw,value=${{ needs.checkout.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main

  publish-tag:
    needs: [checkout, build-app-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.checkout.outputs.version }}
          git push origin ${{ needs.checkout.outputs.version }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.checkout.outputs.version }} --title "${{ needs.checkout.outputs.version }}" --generate-notes

      - name: Delete source branch
        run: |
          git push origin --delete ${{ needs.checkout.outputs.branch }}

      - name: Close Milestone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.checkout.outputs.version }}"
          MILESTONE_NUMBER=$(gh api repos/${{ github.repository }}/milestones --jq ".[] | select(.title | startswith(\"$VERSION\")) | .number")
          if [ -n "$MILESTONE_NUMBER" ]; then
            gh api -X PATCH repos/${{ github.repository }}/milestones/$MILESTONE_NUMBER -f state=closed
          fi
