volumes:
  ipxa_data:
  elasticsearch_data:

services:
  ipxa:
    image: liberatti/ipxa:latest
    restart: unless-stopped
    environment:
      - LOGLEVEL=INFO
      - SECURITY_ENABLED=false
      - API_KEY=tZzDBUSnoy76LLSvu1Vg3e9vdFJINMT2
      - TZ=UTC
    volumes:
      - ipxa_data:/data
    ports:
      - "5001:5000"
    deploy:
      resources:
        limits:
          memory: 256M
      replicas: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=NxGuard@2026
      - TZ=UTC
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:NxGuard@2026 http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    command: >
      bash -c '
        echo "Waiting for Elasticsearch to become ready...";
        until curl -s -u "elastic:NxGuard@2026" "http://elasticsearch:9200" > /dev/null; do
          sleep 3;
        done;
        echo "Configuring kibana_system password...";
        curl -s -u "elastic:NxGuard@2026" -X POST "http://elasticsearch:9200/_security/user/kibana_system/_password" -H "Content-Type: application/json" -d "{\"password\":\"NxGuard@2026\"}";
        echo "kibana_system password configured successfully.";
      '
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=NxGuard@2026
      - TZ=UTC
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully

  api:
    build:
      context: .
    image: liberatti/nxguard:latest
    depends_on:
      - ipxa
      - elasticsearch
      - kibana
    environment:
      - SECURITY_ENABLED=false
      - NXGUARD_ROLE=main
      - TZ=UTC
    ports:
      - 5000:5000
      - 8080:80
      - 8443:443
    volumes:
      - "./api:/opt/nxguard/admin/api"
      - "./engine:/opt/nxguard/admin/engine"
      - "./config.py:/opt/nxguard/admin/config.py"
      - "./main.py:/opt/nxguard/admin/main.py"
      - "./lualib:/opt/nxguard/luajit/share/lua/5.1/nxguard"
      - "./data:/data"
      - "./logs:/opt/nxguard/logs"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: node:lts
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run container"
    ports:
      - "4200:4200"
    environment:
      - TZ=UTC
    volumes:
      - "./web:/app"
 
