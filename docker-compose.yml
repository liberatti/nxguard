services:
  app:
    build:
      context: .
    image: liberatti/nxguard:latest
    environment:
      - REDIS_CACHE_HOST=redis
      - IPXA_URL=ipxa:5000
    ports:
      - 5000:5000
      - 80:80
      - 443:443
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - "./data:/data"
      - "./api:/opt/nxguard/admin/api"
      - "./engine:/opt/nxguard/admin/engine"
      - "./lualib:/opt/nxguard/luajit/share/lua/5.1/nxguard"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7.2
    command: [
      "redis-server",
      "--save 300 100",
      "--appendonly", "no"
    ]
    deploy:
      resources:
        limits:
          memory: 64M

  ipxa:
    image: liberatti/ipxa:latest
    environment:
      - IBLOCKLIST_USERNAME=liberatti.gustavo@gmail.com
      - IBLOCKLIST_PASSWORD=Gt706051
      - MAXMIND_ACCOUNT_ID=943911
      - MAXMIND_LICENSE_KEY=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
    volumes:
      - ipxa_data:/data
    ports:
      - "5002:5000"
    deploy:
      resources:
        limits:
          memory: 256M
      replicas: 1
      
volumes:
  ipxa_data:
