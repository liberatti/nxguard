volumes:
  ipxa_data:

services:
  ipxa:
    image: liberatti/ipxa:latest
    restart: unless-stopped
    environment:
      - LOGLEVEL=INFO
      - SECURITY_ENABLED=false
      - API_KEY=tZzDBUSnoy76LLSvu1Vg3e9vdFJINMT2
    volumes:
      - ipxa_data:/data
    ports:
      - "5001:5000"
    deploy:
      resources:
        limits:
          memory: 256M
      replicas: 1

  app:
    build:
      context: .
    image: liberatti/nxguard:latest
    environment:
      - TELEMETRY_ENABLE=false
      - SECURITY_ENABLED=false
      - NXGUARD_ROLE=main
    ports:
      - 5000:5000
      - 8080:80
      - 8443:443
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - "./api:/opt/nxguard/admin/api"
      - "./engine:/opt/nxguard/admin/engine"
      - "./lualib:/opt/nxguard/luajit/share/lua/5.1/nxguard"
      - "./data:/data"
    extra_hosts:
      - "host.docker.internal:host-gateway" 