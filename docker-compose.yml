volumes:
  ipxa_data:
  opensearch_data:

services:
  ipxa:
    image: liberatti/ipxa:latest
    restart: unless-stopped
    environment:
      - LOGLEVEL=INFO
      - SECURITY_ENABLED=false
      - API_KEY=tZzDBUSnoy76LLSvu1Vg3e9vdFJINMT2
    volumes:
      - ipxa_data:/data
    ports:
      - "5001:5000"
    deploy:
      resources:
        limits:
          memory: 256M
      replicas: 1

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin@NxGuard2026!
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch:9200"]'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=Admin@NxGuard2026!
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    depends_on:
      - opensearch

  api:
    build:
      context: .
    image: liberatti/nxguard:latest
    environment:
      - TELEMETRY_ENABLE=false
      - SECURITY_ENABLED=false
      - NXGUARD_ROLE=main
    ports:
      - 5000:5000
      - 8080:80
      - 8443:443
    volumes:
      - "./api:/opt/nxguard/admin/api"
      - "./engine:/opt/nxguard/admin/engine"
      - "./lualib:/opt/nxguard/luajit/share/lua/5.1/nxguard"
      - "./data:/data"
      - "./logs:/opt/nxguard/logs"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: node:lts
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run container"
    ports:
      - "4200:4200"
    volumes:
      - "./web:/app" 
